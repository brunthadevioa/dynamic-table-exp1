<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Item Table</title>
</head>
<body>

<h2 align="center">Item Registration Table</h2>

<table border="1" align="center" width="700" cellpadding="5" id="itemTable">
    <thead>
        <tr>
            <th>S.No</th>
            <th>Item Name</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
        <!-- Input row for adding items -->
        <tr>
            <td></td>
            <td><input type="text" id="itemName" placeholder="Enter item name"></td>
            <td><input type="number" id="quantity" placeholder="Enter quantity"></td>
            <td><input type="number" id="price" placeholder="Enter price"></td>
            <td><button type="button" onclick="addItem()">Add</button></td>
        </tr>
    </thead>
    <tbody>
        <!-- Dynamic rows will appear here -->
    </tbody>
</table>

<script>
// Counter for serial numbers
let count = 0;

// Function to add item to table
function addItem() {
    let name = document.getElementById("itemName").value.trim();
    let qty = document.getElementById("quantity").value.trim();
    let price = document.getElementById("price").value.trim();

    if (!name || !qty || !price) {
        alert("Please fill all fields");
        return;
    }

    count++;

    let tableBody = document.getElementById("itemTable").getElementsByTagName("tbody")[0];
    let newRow = tableBody.insertRow();

    // Add cells to new row
    newRow.insertCell(0).innerText = count;
    newRow.insertCell(1).innerText = name;
    newRow.insertCell(2).innerText = qty;
    newRow.insertCell(3).innerText = price;
    newRow.insertCell(4).innerHTML = "<button onclick='deleteRow(this)'>Delete</button>";

    // Clear input fields for next entry
    document.getElementById("itemName").value = "";
    document.getElementById("quantity").value = "";
    document.getElementById("price").value = "";

    // Focus back to Item Name input
    document.getElementById("itemName").focus();
}

// Function to delete a row
function deleteRow(button) {
    let row = button.parentNode.parentNode;
    row.parentNode.removeChild(row);

    // Re-number serial numbers
    let tableBody = document.getElementById("itemTable").getElementsByTagName("tbody")[0];
    count = 0;
    for (let r of tableBody.rows) {
        count++;
        r.cells[0].innerText = count;
    }
}
</script>

</body>
</html>
